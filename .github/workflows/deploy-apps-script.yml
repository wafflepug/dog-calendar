name: Deploy Google Apps Script

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'
      - 'scripts/generate-backend-deployment.js'

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "apps-script/.clasp.json"

      - name: Validate committed Waffle AI backend
        run: |
          set -euo pipefail
          node --check apps-script/Code.js
          node --test tests/deployment-attribution.test.js
          node --check apps-script/StableStayIdentity.js
          node --test tests/stable-stay-backend.test.js
          node --check apps-script/V11217EarlyCheckout.js
          node --check apps-script/V11198ConfirmedStayDelete.js
          node --test tests/stay-operation-backend.test.js
          node --check apps-script/WaffleAIProvider.js
          node --check apps-script/WaffleAICalendarFast.js
          node --check apps-script/WaffleAIHealth.js
          grep -q 'WAFFLE_AI_READ_ONLY_ROUTE_V11157' apps-script/Code.js
          grep -q 'waffle_ai_health: true' apps-script/Code.js
          grep -q 'ask_waffle_ai: true' apps-script/Code.js
          grep -q 'getWaffleAiHealthResponseV11157_()' apps-script/Code.js
          grep -q 'getWaffleAiConversationResponseV11157_(data)' apps-script/Code.js
          grep -q 'function getWaffleAiConversationResponseV11157_' apps-script/WaffleAIProvider.js
          grep -q 'function waffleAiTryFastCalendarAnswerV11150_' apps-script/WaffleAICalendarFast.js
          grep -q 'function getWaffleAiHealthResponseV11157_' apps-script/WaffleAIHealth.js

      - name: Generate public backend deployment identity
        run: node scripts/generate-backend-deployment.js

      - name: Push committed source with generated deployment attribution to Google Apps Script
        working-directory: apps-script
        run: clasp push --force

      - name: Update live Apps Script web app deployment
        working-directory: apps-script
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw
        run: |
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID"
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "GitHub main ${GITHUB_SHA::7}"

      - name: Verify live stay and operation identity capabilities
        env:
          APPS_SCRIPT_WEBAPP_URL: https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -fsSLG --max-time 20 "$APPS_SCRIPT_WEBAPP_URL" \
              --data-urlencode 'payload={"action":"get_data_versions"}' || true)"
            if RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys
          try:
              payload = json.loads(os.environ.get('RESPONSE', ''))
          except Exception:
              sys.exit(1)
          versions = payload.get('versions') or {}
          deployment = payload.get('deployment') or {}
          if payload.get('result') != 'success' or versions.get('stableStayIdentityVersion') != 1 or versions.get('stayOperationIdentityVersion') != 1:
              sys.exit(1)
          if deployment.get('commitSha') != os.environ.get('GITHUB_SHA') or str(deployment.get('workflowRunId')) != os.environ.get('GITHUB_RUN_ID'):
              sys.exit(1)
          print('Live stable stay and operation identity capabilities verified with a read-only request.')
          print('Live backend deployment SHA and workflow run identity verified.')
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo "Stay and operation identity capability verification failed."
          exit 1

      - name: Verify live Waffle maintenance safety state
        env:
          APPS_SCRIPT_WEBAPP_URL: https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec
        run: |
          set -euo pipefail

          expected="$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path('apps-script/MaintenanceMode.js').read_text(encoding='utf-8')
          match = re.search(r'WAFFLE_MAINTENANCE_DEFAULT_\s*=\s*(true|false)\s*;', text)
          if not match:
              sys.exit('Could not determine WAFFLE_MAINTENANCE_DEFAULT_.')
          print(match.group(1))
          PY
          )"

          for attempt in $(seq 1 12); do
            response="$(curl -fsSLG --max-time 20 "$APPS_SCRIPT_WEBAPP_URL" \
              --data-urlencode 'action=maintenance_status' \
              --data-urlencode "_=${GITHUB_RUN_ID}-${attempt}" || true)"

            if RESPONSE="$response" EXPECTED="$expected" python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get('RESPONSE', '')
          expected = os.environ.get('EXPECTED', '').lower() == 'true'
          try:
              payload = json.loads(raw)
          except Exception:
              sys.exit(1)

          ok = (
              payload.get('result') == 'success'
              and payload.get('action') == 'maintenance_status'
              and payload.get('version') == '11.1.91'
              and payload.get('enabled') is expected
          )
          if not ok:
              sys.exit(1)

          print(
              'Live maintenance safety verified · enabled=' +
              str(payload.get('enabled')).lower() +
              ' · source=' +
              str(payload.get('source', 'unknown'))
          )
          PY
            then
              exit 0
            fi

            echo "Maintenance status endpoint not at expected state $expected yet (attempt $attempt/12); retrying..."
            sleep 5
          done

          echo "Live maintenance safety verification failed; refusing to mark deployment healthy."
          exit 1

      - name: Verify live Groq-first Waffle AI route
        env:
          APPS_SCRIPT_WEBAPP_URL: https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -fsSLG --max-time 20 "$APPS_SCRIPT_WEBAPP_URL" \
              --data-urlencode 'payload={"action":"waffle_ai_health"}' || true)"

            if RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("RESPONSE", "")
          try:
              payload = json.loads(raw)
          except Exception:
              sys.exit(1)

          ok = (
              payload.get("result") == "success"
              and payload.get("action") == "waffle_ai_health"
              and payload.get("version") == "11.1.57"
              and payload.get("routeReady") is True
              and payload.get("readOnly") is True
              and payload.get("groqArchitecture") is True
              and payload.get("groqFreeTierOptimized") is True
              and payload.get("paidOpenAiFallbackOptInOnly") is True
              and payload.get("calendarFastPath") is True
              and payload.get("completeMonthRosters") is True
              and payload.get("calendarFastNoAiRoundTrip") is True
              and payload.get("calendarFastPathMode") == "targeted-B-L-month-filter"
          )
          if not ok:
              sys.exit(1)

          print(
              "Live Waffle AI V11.1.57 Groq architecture verified · provider="
              + str(payload.get("preferredProvider", payload.get("provider", "unknown")))
              + " · groqConfigured="
              + str(payload.get("groqConfigured", False)).lower()
              + " · migrationPending="
              + str(payload.get("migrationPending", False)).lower()
          )
          PY
            then
              exit 0
            fi

            echo "Waffle AI V11.1.57 health route not live yet (attempt $attempt/12); retrying..."
            sleep 5
          done

          echo "Live Waffle AI V11.1.57 route verification failed."
          exit 1

      - name: Show Apps Script deployments
        working-directory: apps-script
        run: clasp list-deployments
