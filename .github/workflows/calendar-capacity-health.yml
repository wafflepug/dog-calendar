name: Calendar Capacity Health

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  capacity-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate capacity health in canonical Calendar
        run: |
          set -euo pipefail
          node --check calendar.js
          test ! -e waffle-v11.1.68.js
          grep -q "CANONICAL CALENDAR SOURCE · waffle-v11.1.68.js" calendar.js
          grep -q "GREEN  = 0–2 confirmed dogs" calendar.js
          grep -q "AMBER  = 3 confirmed dogs" calendar.js
          grep -q "RED    = 4+ confirmed dogs" calendar.js
          grep -q "props.isMeetGreet !== true && props.isPotential !== true" calendar.js
          grep -q "wh68-capacity-health" calendar.js
          grep -q "data-tone=\"green\"" calendar.js
          grep -q "data-tone=\"amber\"" calendar.js
          grep -q "data-tone=\"red\"" calendar.js
          grep -q "WAFFLE_CALENDAR_CANONICAL" calendar.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('waffle-v11.0.5.js').read_text(encoding='utf-8')
          match = re.search(r'async function ensureCleanCalendar\(\) \{(.*?)\n  \}', text, re.S)
          assert match, 'ensureCleanCalendar() not found'
          block = match.group(1)
          assert "'calendar.js'" in block
          assert 'WAFFLE_CALENDAR_CANONICAL' in block
          assert "'waffle-v11.1.61.js'" not in block
          print('Confirmed-only capacity health is active only through canonical calendar.js')
          PY
