name: Release Attribution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate public attribution and offline states
        run: |
          node --check system-status-release.js
          node --test tests/system-status-release.test.js tests/deployment-attribution.test.js
      - name: Build with the existing GitHub Pages Jekyll engine
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated website identity
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const manifest = JSON.parse(fs.readFileSync('_site/waffle-deployment.json', 'utf8'));
          assert.equal(manifest.schemaVersion, 1);
          assert.equal(manifest.artifact.commitSha, process.env.GITHUB_SHA);
          assert.ok(Number.isFinite(Date.parse(manifest.artifact.generatedAt)));
          assert.ok(!('backend' in manifest), 'A website manifest cannot verify backend deployment.');
          console.log('Jekyll generated the exact source SHA and artifact timestamp.');
          JS
