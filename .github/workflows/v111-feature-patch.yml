              css_path.write_text(css, encoding='utf-8')

          code = code_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global code
              if new in code:
                  return
              if old not in code:
                  raise SystemExit(f'Patch anchor not found: {label}')
              code = code.replace(old, new, 1)

          replace_once(
              '      if (isNewReminderNote) {\n        safeSendPushToCategory_(',
              '      if (isNewReminderNote) {\n        try {\n          sendNewReminderEmail_(result.record);\n        } catch (reminderEmailError) {\n          console.warn("Reminder email could not be sent:", reminderEmailError);\n        }\n\n        safeSendPushToCategory_(',
              'reminder email'
          )

          replace_once(
              '      result.row = sheet.getLastRow();\n      result.bookingType = "Potential Stay";',
              '      result.row = sheet.getLastRow();\n      storeWaffleRequestSource_(sheet, result.row, data.requestSource);\n      result.bookingType = "Potential Stay";',
              'create potential source'
          )

          replace_once(
              '      result.row = updateRow;\n      result.bookingType = "Potential Stay";',
              '      result.row = updateRow;\n      storeWaffleRequestSource_(sheet, result.row, data.requestSource);\n      result.bookingType = "Potential Stay";',
              'update potential source'
          )

          replace_once(
              '      result.row = confirmRow;\n      result.bookingType = "Confirmed Boarding";',
              '      result.row = confirmRow;\n      storeWaffleRequestSource_(sheet, result.row, data.requestSource);\n      result.bookingType = "Confirmed Boarding";',
              'confirm potential source'
          )

          replace_once(
              '  var row=sheet.getLastRow();\n  var stayKey=makeGuestStayKey_(dogName,start,end);',
              '  var row=sheet.getLastRow();\n  storeWaffleRequestSource_(sheet,row,data.requestSource);\n  var stayKey=makeGuestStayKey_(dogName,start,end);',
              'create boarding source'
          )

          replace_once(
              '      result.row = sheet.getLastRow();\n\n      var boardingAfter = auditBookingSnapshotFromSheetRow_(',
              '      result.row = sheet.getLastRow();\n      storeWaffleRequestSource_(sheet, result.row, data.requestSource);\n\n      var boardingAfter = auditBookingSnapshotFromSheetRow_(',
              'legacy boarding source'
          )

          replace_once(
              '      bookingType:\n        "Potential Stay"',
              '      requestSource:\n        readWaffleRequestSource_(sheet, i + 1),\n      bookingType:\n        "Potential Stay"',
              'potential read source'
          )

          replace_once(
              '    "    : \\"📷 Add Belongings Photos\\";",',
              '    "    : (isStayPhoto ? \\"📸 Add Stay Photos\\" : \\"📷 Add Belongings Photos\\");",',
              'stay photo uploader title'
          )

          replace_once(
              '    "    : \\"Choose up to 8 photos in one selection, or take a photo with the camera.\\";",',
              '    "    : (isStayPhoto ? \\"Choose up to 8 photos for this stay, or take a photo with the camera.\\" : \\"Choose up to 8 photos in one selection, or take a photo with the camera.\\");",',
              'stay photo uploader subtitle'
          )

          code_path.write_text(code, encoding='utf-8')

          # Force a clean PWA/app-shell refresh so mobile devices receive this release.
          versioned_files = [
              Path('index.html'), Path('directory.html'), Path('reminders.html'), Path('audit.html'),
              Path('waffle-app.js'), Path('service-worker.js')
          ]
          for path in versioned_files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('v=11.0.5', 'v=11.1.0')
              if path.name == 'service-worker.js':
                  text = text.replace("const WAFFLE_SW_VERSION = 'v11.0.5';", "const WAFFLE_SW_VERSION = 'v11.1.0';")
              path.write_text(text, encoding='utf-8')

          # This workflow is intentionally one-shot; remove it from the feature branch after patching.
          Path('.github/workflows/v111-feature-patch.yml').unlink()
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check waffle-v11.0.5.js
          node --check apps-script/V111Features.js
          node --check apps-script/Code.js
          node --check service-worker.js

      - name: Commit feature batch
        run: |
          git config user.name "Waffle House Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- waffle-v11.0.5.js waffle-v11.0.5.css waffle-app.js service-worker.js index.html directory.html reminders.html audit.html apps-script/Code.js apps-script/V111Features.js .github/workflows/v111-feature-patch.yml
          git diff --cached --check
          git commit -m "Add mobile operations and photo workflow improvements"
          git push origin HEAD:feature/mobile-ops-photos-reminders
