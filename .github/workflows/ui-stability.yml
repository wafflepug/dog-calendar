name: UI Stability Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  final-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate final UI contract
        run: python3 scripts/check-ui-stability.py
