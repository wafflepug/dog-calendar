name: UI Stability Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  final-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate final UI contract
        run: python3 scripts/check-ui-stability.py

      - name: Validate JavaScript
        run: |
          node --check waffle-v11.0.5.js
          node --check calendar.js
          node --check care.js
          node --check organiser.js
          node --check logs.js
          node --check waffle-ui.js
          node --check waffle-ai.js
          node --check service-worker.js
          node --check apps-script/WaffleAI.js
          node --check apps-script/WaffleAIProvider.js
          node --check apps-script/WaffleAICalendarFast.js
          node --check apps-script/WaffleAICompat.js
          node --check apps-script/WaffleAIHealth.js

      - name: Validate canonical shared UI
        run: |
          grep -q "WAFFLE_UI_CANONICAL" waffle-ui.js
          grep -q "WAFFLE_UI_CONTRACT" waffle-ui.js
          grep -q "v11175MobileSitterShellVersion" waffle-ui.js
          grep -q "v11176AuthoritativeMobileFooterVersion" waffle-ui.js
          grep -q "v11180MobileHeaderRailVersion" waffle-ui.js
          grep -q "v11181MobileHeaderAvatarsVersion" waffle-ui.js
          grep -q "v11182CleanMobileTodayHeaderVersion" waffle-ui.js
          grep -q "v11189MobileQuickActionCompletionVersion" waffle-ui.js
          grep -q "label.textContent = 'Organiser'" waffle-ai.js
          grep -q "removeEverythingAfterFooter" waffle-ai.js
          grep -q ".aw37-foot ~ \*" waffle-ai.js
          if grep -q "style.removeProperty('display')" waffle-ui.js organiser.js care.js waffle-ai.js; then
            echo "Canonical UI modules must not use the banned display recovery pattern"
            exit 1
          fi
          # stopImmediatePropagation is intentionally used by Ask Waffle form
          # handling and by the canonical reminder Quick Action to suppress old
          # duplicate handlers. It must not exist in Care's rebuilt tab layer.
          if grep -q "event.stopImmediatePropagation" care.js; then
            echo "Canonical Care must not suppress native profile-tab listeners"
            exit 1
          fi
          if grep -q "script.src = 'waffle-v11.1.80.js" waffle-ui.js; then
            echo "Canonical UI must not dynamically reactivate historical V11.1.80"
            exit 1
          fi

      - name: Validate canonical desktop Care
        run: |
          grep -q "WAFFLE HOUSE — CANONICAL CARE / GUEST DIRECTORY MODULE" care.js
          grep -q "WAFFLE_CARE_CANONICAL" care.js
          grep -q "v11160DesktopCareRebuildVersion" care.js
          grep -q "v11160-desktop-tabs" care.js
          grep -q "label: 'Profile'" care.js
          grep -q "label: 'Belongings'" care.js
          grep -q "label: 'Media'" care.js
          grep -q "label: 'History'" care.js
          grep -q "label: 'Master'" care.js
          grep -q "switchDirectoryProfileMainTab" care.js
          grep -q "v108LoadHistory" care.js
          grep -q "v110LoadMedia" care.js
          grep -q "v110LoadMasterProfile" care.js
          grep -q "'care.js'" waffle-v11.0.5.js
          grep -q "WAFFLE_CARE_CANONICAL" waffle-v11.0.5.js
          if grep -q "window.addEventListener('click', handleClick, true)" care.js; then
            echo "Canonical desktop tabs must not use the old window-capture interception architecture"
            exit 1
          fi

      - name: Validate canonical Calendar behavior
        run: |
          grep -q "WAFFLE_CALENDAR_CANONICAL" calendar.js
          grep -q "FullCalendar is no longer a visible UI" calendar.js
          grep -q "pointer-events:none!important" calendar.js
          grep -q "let viewMode = 'month'" calendar.js
          grep -q "viewButton('month', 'Month')" calendar.js
          grep -q "viewButton('fortnight', 'Fortnight')" calendar.js
          grep -q "viewButton('week', 'Week')" calendar.js
          grep -q "function allocateWeekLanes" calendar.js
          grep -q "grid-auto-rows:28px" calendar.js
          grep -q "Confirmed Stay" calendar.js
          grep -q "Potential Stay" calendar.js
          grep -q "Meet &amp; Greet" calendar.js
          grep -q "GREEN  = 0–2 confirmed dogs" calendar.js
          grep -q "AMBER  = 3 confirmed dogs" calendar.js
          grep -q "RED    = 4+ confirmed dogs" calendar.js
          grep -q "v11170PotentialLabelVersion" calendar.js
          grep -q "v11171LegacyCalendarFilterRetirementVersion" calendar.js
          grep -q "v11172MeetOutlookAlignmentVersion" calendar.js
          grep -q "grid-template-rows:16px minmax(42px,1fr) 14px" calendar.js
          grep -q "min-height:82px" calendar.js
          grep -q "v1088DateChoiceModal" calendar.js
          if grep -q "data-wh65-filter" calendar.js; then
            echo "Single Calendar must not expose event filters"
            exit 1
          fi

      - name: Validate canonical Organiser and Logs boundaries
        run: |
          grep -q "WAFFLE_ORGANISER_CANONICAL" organiser.js
          grep -q "save_organiser_item" organiser.js
          grep -q "get_organiser" organiser.js
          grep -q "WAFFLE_LOGS_CANONICAL" logs.js
          grep -q "dataOwner: 'waffle-app.js'" logs.js
          grep -q "organiser.js?build=" waffle-ui.js
          if grep -q "waffle-v11.1.15.js?v=" waffle-ui.js; then
            echo "Canonical UI must not reactivate historical Organiser runtime"
            exit 1
          fi

      - name: Validate intake OCR workflow
        run: |
          grep -q "v11190CarePdfOcrVersion" waffle-v11.0.5.js
          grep -q "openLegacyIntakeUploadBtn" waffle-v11.0.5.js
          grep -q "Read the entire PDF, including scanned pages, handwriting, tick boxes and printed form labels." apps-script/Code.js
          grep -q "Apply Selected Extracted Values" apps-script/LegacyIntake.html
          grep -q "saveLegacyIntakeMediaFromHtml" apps-script/V11191LegacyIntakeMedia.js
          grep -q "capture=\"environment\"" apps-script/LegacyIntake.html

      - name: Validate Ask Waffle speech to text
        run: |
          grep -q "'waffle-ai.js'" waffle-v11.0.5.js
          grep -q "WAFFLE_AI_CANONICAL" waffle-ai.js
          grep -q "SpeechRecognition" waffle-ai.js
          grep -q "webkitSpeechRecognition" waffle-ai.js
          grep -q "recognition.lang = 'en-AU'" waffle-ai.js
          grep -q "Listening…" waffle-ai.js
          grep -q "aw58-listening-avatar" waffle-ai.js
          grep -q "window.v11158WaffleSpeechVersion" waffle-ai.js

      - name: Validate Groq-first Waffle AI architecture
        run: |
          grep -q "GROQ_API_KEY" apps-script/WaffleAIProvider.js
          grep -q "openai/gpt-oss-120b" apps-script/WaffleAIProvider.js
          grep -q "https://api.groq.com/openai/v1/chat/completions" apps-script/WaffleAIProvider.js
          grep -q "WAFFLE_AI_ENABLE_GEMINI_FALLBACK" apps-script/WaffleAIProvider.js
          grep -q "WAFFLE_AI_ENABLE_OPENAI_FALLBACK" apps-script/WaffleAIProvider.js
          grep -q "function getWaffleAiGeminiResponseV11148Fixed_" apps-script/WaffleAIProvider.js
          grep -q "function waffleAiTryFastCalendarAnswerV11150_" apps-script/WaffleAICalendarFast.js
          grep -q "groqFreeTierOptimized: true" apps-script/WaffleAIHealth.js

      - name: Validate committed Apps Script AI routes
        run: |
          grep -q 'WAFFLE_AI_READ_ONLY_ROUTE_V11157' apps-script/Code.js
          grep -q 'waffle_ai_health: true' apps-script/Code.js
          grep -q 'ask_waffle_ai: true' apps-script/Code.js
          grep -q 'getWaffleAiHealthResponseV11157_()' apps-script/Code.js
          grep -q 'getWaffleAiConversationResponseV11157_(data)' apps-script/Code.js
          test ! -e scripts/patch-waffle-ai-router.py

      - name: Validate PWA runtime freshness
        run: |
          grep -q "waffle-bootstrap.js" service-worker.js
          grep -q "waffle-runtime.css" service-worker.js
          grep -q "calendar.js" service-worker.js
          grep -q "care.js" service-worker.js
          grep -q "organiser.js" service-worker.js
          grep -q "logs.js" service-worker.js
          grep -q "waffle-ui.js" service-worker.js
          grep -q "waffle-ai.js" service-worker.js
          grep -q "path.endsWith('.js')" service-worker.js
          grep -q "path.endsWith('.css')" service-worker.js
          grep -q "fetch(request, { cache: 'no-store' })" service-worker.js
          if grep -Eq "waffle-v11\.1\.(15|37|38|39|40|45|47|48|53|58|60|75|76|80|89)\.js" service-worker.js; then
            echo "Historical feature patches must not be pinned in the service-worker app shell"
            exit 1
          fi
