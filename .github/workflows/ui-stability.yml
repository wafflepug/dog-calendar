name: UI Stability Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  final-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate final UI contract
        run: python3 scripts/check-ui-stability.py

      - name: Validate JavaScript
        run: |
          node --check waffle-v11.0.5.js
          node --check waffle-v11.1.45.js
          node --check waffle-v11.1.47.js
          node --check waffle-v11.1.48.js
          node --check waffle-v11.1.52.js
          node --check waffle-v11.1.53.js
          node --check waffle-v11.1.58.js
          node --check waffle-v11.1.59.js
          node --check waffle-v11.1.60.js
          node --check waffle-v11.1.61.js
          node --check waffle-v11.1.66.js
          node --check waffle-v11.1.67.js
          node --check waffle-v11.1.68.js
          node --check waffle-v11.1.69.js
          node --check waffle-v11.1.70.js
          node --check waffle-v11.1.71.js
          node --check waffle-v11.1.72.js
          node --check service-worker.js
          node --check apps-script/WaffleAI.js
          node --check apps-script/WaffleAIProvider.js
          node --check apps-script/WaffleAIProviderV11148.js
          node --check apps-script/WaffleAIProviderV11149.js
          node --check apps-script/WaffleAIProviderV11150.js
          node --check apps-script/WaffleAIProviderV11157.js
          node --check apps-script/WaffleAIGeminiRepairV11148.js
          node --check apps-script/WaffleAICalendarFastV11149.js
          node --check apps-script/WaffleAICalendarFastV11150.js
          node --check apps-script/WaffleAICompat.js
          node --check apps-script/WaffleAIHealth.js
          node --check apps-script/WaffleAIHealthV11148.js
          node --check apps-script/WaffleAIHealthV11149.js
          node --check apps-script/WaffleAIHealthV11150.js
          node --check apps-script/WaffleAIHealthV11157.js

      - name: Validate unified action chrome
        run: |
          grep -q "'calendar', 'directory', 'reminders', 'audit'" waffle-v11.1.53.js
          grep -q "waffle-v11.1.53.js" waffle-v11.0.5.js
          grep -q "removeEverythingAfterFooter" waffle-v11.1.53.js
          grep -q ".aw37-foot ~ \*" waffle-v11.1.53.js
          grep -q "label.textContent = 'Organiser'" waffle-v11.1.53.js
          if grep -q "event.stopImmediatePropagation" waffle-v11.1.53.js; then
            echo "Shared chrome must not suppress native profile-tab listeners"
            exit 1
          fi

      - name: Validate rebuilt desktop Care tabs
        run: |
          grep -q "waffle-v11.1.60.js" waffle-v11.0.5.js
          grep -q "v11160DesktopCareRebuildVersion" waffle-v11.1.60.js
          grep -q "v11160-desktop-tabs" waffle-v11.1.60.js
          grep -q "label: 'Profile'" waffle-v11.1.60.js
          grep -q "label: 'Belongings'" waffle-v11.1.60.js
          grep -q "label: 'Media'" waffle-v11.1.60.js
          grep -q "label: 'History'" waffle-v11.1.60.js
          grep -q "label: 'Master'" waffle-v11.1.60.js
          grep -q "switchDirectoryProfileMainTab" waffle-v11.1.60.js
          grep -q "v108LoadHistory" waffle-v11.1.60.js
          grep -q "v110LoadMedia" waffle-v11.1.60.js
          grep -q "v110LoadMasterProfile" waffle-v11.1.60.js
          if grep -q "window.addEventListener('click', handleClick, true)" waffle-v11.1.60.js; then
            echo "Rebuilt desktop tabs must not use the old window-capture interception architecture"
            exit 1
          fi
          if grep -q "style.removeProperty('display')" waffle-v11.1.60.js; then
            echo "Rebuilt desktop tabs must not use the banned display recovery pattern"
            exit 1
          fi

      - name: Validate single unlimited Calendar stack
        run: |
          grep -q "waffle-v11.1.69.js" waffle-v11.1.61.js
          grep -q "waffle-v11.1.66.js" waffle-v11.1.61.js
          grep -q "waffle-v11.1.67.js" waffle-v11.1.61.js
          grep -q "waffle-v11.1.68.js" waffle-v11.1.61.js
          grep -q "waffle-v11.1.70.js" waffle-v11.1.61.js
          grep -q "waffle-v11.1.71.js" waffle-v11.1.61.js
          grep -q "waffle-v11.1.72.js" waffle-v11.1.61.js
          grep -q "11.1.72-outlook-alignment-bridge" waffle-v11.1.61.js
          if grep -q "waffle-v11.1.63.js" waffle-v11.1.61.js || grep -q "waffle-v11.1.64.js" waffle-v11.1.61.js || grep -q "waffle-v11.1.65.js" waffle-v11.1.61.js; then
            echo "Retired visible Calendar renderers must not load through the compatibility bridge"
            exit 1
          fi
          grep -q "v11169CalendarViewsVersion" waffle-v11.1.69.js
          grep -q "FullCalendar is no longer a visible UI" waffle-v11.1.69.js
          grep -q "pointer-events:none!important" waffle-v11.1.69.js
          grep -q "let viewMode = 'month'" waffle-v11.1.69.js
          grep -q "viewButton('month', 'Month')" waffle-v11.1.69.js
          grep -q "viewButton('fortnight', 'Fortnight')" waffle-v11.1.69.js
          grep -q "viewButton('week', 'Week')" waffle-v11.1.69.js
          grep -q "function allocateWeekLanes" waffle-v11.1.69.js
          grep -q "grid-auto-rows:28px" waffle-v11.1.69.js
          grep -q "Confirmed Stay" waffle-v11.1.69.js
          grep -q "Potential Stay" waffle-v11.1.69.js
          grep -q "Meet &amp; Greet" waffle-v11.1.69.js
          if grep -q "data-wh65-filter" waffle-v11.1.69.js; then
            echo "Single Calendar must not expose event filters"
            exit 1
          fi

      - name: Validate Calendar detail layers
        run: |
          grep -q "labels.time" waffle-v11.1.66.js
          grep -q "display:none !important" waffle-v11.1.67.js
          grep -q "GREEN  = 0–2 confirmed dogs" waffle-v11.1.68.js
          grep -q "AMBER  = 3 confirmed dogs" waffle-v11.1.68.js
          grep -q "RED    = 4+ confirmed dogs" waffle-v11.1.68.js
          grep -q "v11170PotentialLabelVersion" waffle-v11.1.70.js
          grep -q "petNameFromLabel" waffle-v11.1.70.js
          grep -q "v11171LegacyCalendarFilterRetirementVersion" waffle-v11.1.71.js
          grep -q "drag a booking to move dates" waffle-v11.1.71.js

      - name: Validate Meet and Greet outlook alignment
        run: |
          grep -q "v11172MeetOutlookAlignmentVersion" waffle-v11.1.72.js
          grep -q "grid-template-rows:16px minmax(42px,1fr) 14px" waffle-v11.1.72.js
          grep -q "wh72-meet-main" waffle-v11.1.72.js
          grep -q "wh72-meet-events" waffle-v11.1.72.js
          grep -q "align-items:stretch" waffle-v11.1.72.js
          grep -q "min-height:82px" waffle-v11.1.72.js

      - name: Validate legacy Calendar date chooser retirement
        run: |
          grep -q "v11162CalendarDateClickVersion" waffle-v11.1.45.js
          grep -q "v1088DateChoiceModal" waffle-v11.1.45.js
          grep -q "Booking creation remains in the" waffle-v11.1.45.js
          grep -q "v1088DateChoiceModal" waffle-v11.1.69.js

      - name: Validate Ask Waffle speech to text
        run: |
          grep -q "waffle-v11.1.58.js" waffle-v11.0.5.js
          grep -q "SpeechRecognition" waffle-v11.1.58.js
          grep -q "webkitSpeechRecognition" waffle-v11.1.58.js
          grep -q "recognition.lang = 'en-AU'" waffle-v11.1.58.js
          grep -q "Listening…" waffle-v11.1.58.js
          grep -q "aw58-listening-avatar" waffle-v11.1.58.js
          grep -q "window.v11158WaffleSpeechVersion" waffle-v11.1.58.js

      - name: Validate Groq-first Waffle AI architecture
        run: |
          grep -q "GROQ_API_KEY" apps-script/WaffleAIProviderV11157.js
          grep -q "openai/gpt-oss-120b" apps-script/WaffleAIProviderV11157.js
          grep -q "https://api.groq.com/openai/v1/chat/completions" apps-script/WaffleAIProviderV11157.js
          grep -q "WAFFLE_AI_ENABLE_GEMINI_FALLBACK" apps-script/WaffleAIProviderV11157.js
          grep -q "WAFFLE_AI_ENABLE_OPENAI_FALLBACK" apps-script/WaffleAIProviderV11157.js
          grep -q "groqFreeTierOptimized: true" apps-script/WaffleAIHealthV11157.js

      - name: Validate Apps Script AI router patch
        run: |
          python3 scripts/patch-waffle-ai-router.py
          grep -q 'WAFFLE_AI_READ_ONLY_ROUTE_V11157' apps-script/Code.js
          grep -q 'waffle_ai_health: true' apps-script/Code.js
          grep -q 'ask_waffle_ai: true' apps-script/Code.js
          grep -q 'getWaffleAiHealthResponseV11157_()' apps-script/Code.js
          grep -q 'getWaffleAiConversationResponseV11157_(data)' apps-script/Code.js
