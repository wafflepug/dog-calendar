name: UI Stability Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  final-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate final UI contract
        run: python3 scripts/check-ui-stability.py

      - name: Validate conversational Waffle AI JavaScript
        run: |
          node --check waffle-v11.0.5.js
          node --check waffle-v11.1.47.js
          node --check waffle-v11.1.48.js
          node --check waffle-v11.1.52.js
          node --check waffle-v11.1.53.js
          node --check waffle-v11.1.58.js
          node --check waffle-v11.1.59.js
          node --check apps-script/WaffleAI.js
          node --check apps-script/WaffleAIProvider.js
          node --check apps-script/WaffleAIProviderV11148.js
          node --check apps-script/WaffleAIProviderV11149.js
          node --check apps-script/WaffleAIProviderV11150.js
          node --check apps-script/WaffleAIProviderV11157.js
          node --check apps-script/WaffleAIGeminiRepairV11148.js
          node --check apps-script/WaffleAICalendarFastV11149.js
          node --check apps-script/WaffleAICalendarFastV11150.js
          node --check apps-script/WaffleAICompat.js
          node --check apps-script/WaffleAIHealth.js
          node --check apps-script/WaffleAIHealthV11148.js
          node --check apps-script/WaffleAIHealthV11149.js
          node --check apps-script/WaffleAIHealthV11150.js
          node --check apps-script/WaffleAIHealthV11157.js

      - name: Validate unified action chrome scope
        run: |
          grep -q "'calendar', 'directory', 'reminders', 'audit'" waffle-v11.1.53.js
          grep -q "waffle-v11.1.53.js" waffle-v11.0.5.js
          grep -q "bottom: 96px" waffle-v11.1.53.js
          grep -q "bottom: calc(88px" waffle-v11.1.53.js

      - name: Validate Request From retirement
        run: |
          grep -q "removeEverythingAfterFooter" waffle-v11.1.53.js
          grep -q ".aw37-foot ~ \*" waffle-v11.1.53.js
          grep -q "v11.1.54-request-from-final" service-worker.js
          grep -q "waffle-v11.1.53.js?v=11.1.53" service-worker.js
          grep -q "url.pathname.endsWith('/waffle-v11.1.53.js')" service-worker.js

      - name: Validate Care desktop tab parity and Organiser label
        run: |
          grep -q "v11156CareTabParityVersion" waffle-v11.1.53.js
          grep -q "handleDesktopCareTab" waffle-v11.1.53.js
          grep -q "document.addEventListener('click', handleDesktopCareTab, false)" waffle-v11.1.53.js
          grep -q "Native listeners are allowed to run first" waffle-v11.1.53.js
          grep -q "directory-main-profile-tab" waffle-v11.1.53.js
          grep -q "content: none !important" waffle-v11.1.53.js
          grep -q "label.textContent = 'Organiser'" waffle-v11.1.53.js
          if grep -q "event.stopImmediatePropagation" waffle-v11.1.53.js; then
            echo "Care shared chrome layer must not suppress native profile-tab listeners"
            exit 1
          fi

      - name: Validate deterministic desktop Care tab authority
        run: |
          grep -q "waffle-v11.1.59.js" waffle-v11.0.5.js
          grep -q "window.addEventListener('click', handleClick, true)" waffle-v11.1.59.js
          grep -q "'(min-width: 769px)'" waffle-v11.1.59.js
          grep -q "'profile', 'belongings', 'media', 'history', 'master'" waffle-v11.1.59.js
          grep -q "switchDirectoryProfileMainTab" waffle-v11.1.59.js
          grep -q "v110OpenCustomPanel" waffle-v11.1.59.js
          grep -q "loadDirectoryBelongingsDetail" waffle-v11.1.59.js
          grep -q "ensureHistoryFallbackPanel" waffle-v11.1.59.js
          grep -q "event.stopImmediatePropagation" waffle-v11.1.59.js
          grep -q "window.v11159CareDesktopTabsVersion" waffle-v11.1.59.js

      - name: Validate Ask Waffle speech to text
        run: |
          grep -q "waffle-v11.1.58.js" waffle-v11.0.5.js
          grep -q "SpeechRecognition" waffle-v11.1.58.js
          grep -q "webkitSpeechRecognition" waffle-v11.1.58.js
          grep -q "recognition.lang = 'en-AU'" waffle-v11.1.58.js
          grep -q "Listening…" waffle-v11.1.58.js
          grep -q "aw58-listening-avatar" waffle-v11.1.58.js
          grep -q "data:image/webp;base64" waffle-v11.1.58.js
          grep -q "window.v11158WaffleSpeechVersion" waffle-v11.1.58.js

      - name: Validate Groq-first Waffle AI architecture
        run: |
          grep -q "GROQ_API_KEY" apps-script/WaffleAIProviderV11157.js
          grep -q "openai/gpt-oss-120b" apps-script/WaffleAIProviderV11157.js
          grep -q "https://api.groq.com/openai/v1/chat/completions" apps-script/WaffleAIProviderV11157.js
          grep -q "WAFFLE_AI_ENABLE_GEMINI_FALLBACK" apps-script/WaffleAIProviderV11157.js
          grep -q "WAFFLE_AI_ENABLE_OPENAI_FALLBACK" apps-script/WaffleAIProviderV11157.js
          grep -q "groqFreeTierOptimized: true" apps-script/WaffleAIHealthV11157.js
          grep -q "paidOpenAiFallbackOptInOnly: true" apps-script/WaffleAIHealthV11157.js

      - name: Validate Apps Script AI router patch
        run: |
          python3 scripts/patch-waffle-ai-router.py
          grep -q 'WAFFLE_AI_READ_ONLY_ROUTE_V11157' apps-script/Code.js
          grep -q 'waffle_ai_health: true' apps-script/Code.js
          grep -q 'ask_waffle_ai: true' apps-script/Code.js
          grep -q 'getWaffleAiHealthResponseV11157_()' apps-script/Code.js
          grep -q 'getWaffleAiConversationResponseV11157_(data)' apps-script/Code.js
