name: Cross-device UI Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'playwright.ui.config.js'
      - 'tests/ui-regression.spec.js'
      - 'tests/local-ui-runner.test.js'
      - 'tests/local-network-policy.test.js'
      - 'tests/waffle-bootstrap-lifecycle.test.js'
      - 'tests/care-profile-readiness.test.js'
      - 'tests/care-profile-readiness.browser.spec.js'
      - 'tests/care-overview-refinement.browser.spec.js'
      - 'tests/care-state-preservation.test.js'
      - 'playwright.care-profile.config.js'
      - 'playwright.care-mobile-hierarchy.config.js'
      - 'tests/care-mobile-hierarchy.browser.spec.js'
      - 'tests/care-loading-feedback.browser.spec.js'
      - 'playwright.care-loading-feedback.config.js'
      - 'tests/care-navigation-continuity.test.js'
      - 'tests/care-navigation-continuity.browser.spec.js'
      - 'playwright.care-navigation-continuity.config.js'
      - 'scripts/local-network-policy.js'
      - 'scripts/run-local-ui.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/summarize-ui-regression.js'
      - '.github/workflows/ui-regression.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'playwright.ui.config.js'
      - 'tests/ui-regression.spec.js'
      - 'tests/local-ui-runner.test.js'
      - 'tests/local-network-policy.test.js'
      - 'tests/waffle-bootstrap-lifecycle.test.js'
      - 'tests/care-profile-readiness.test.js'
      - 'tests/care-profile-readiness.browser.spec.js'
      - 'tests/care-overview-refinement.browser.spec.js'
      - 'tests/care-state-preservation.test.js'
      - 'playwright.care-profile.config.js'
      - 'playwright.care-mobile-hierarchy.config.js'
      - 'tests/care-mobile-hierarchy.browser.spec.js'
      - 'tests/care-loading-feedback.browser.spec.js'
      - 'playwright.care-loading-feedback.config.js'
      - 'tests/care-navigation-continuity.test.js'
      - 'tests/care-navigation-continuity.browser.spec.js'
      - 'playwright.care-navigation-continuity.config.js'
      - 'scripts/local-network-policy.js'
      - 'scripts/run-local-ui.js'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/summarize-ui-regression.js'
      - '.github/workflows/ui-regression.yml'

permissions:
  contents: read

concurrency:
  group: cross-device-ui-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and browser engines
        run: |
          set -euo pipefail
          npm ci
          node --test tests/local-ui-runner.test.js
          node --test tests/local-network-policy.test.js
          node --test tests/waffle-bootstrap-lifecycle.test.js
          node --test tests/care-profile-readiness.test.js
          node --test tests/care-state-preservation.test.js
          node --test tests/care-navigation-continuity.test.js
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
          node node_modules/@playwright/test/cli.js test --config=playwright.care-profile.config.js
          node node_modules/@playwright/test/cli.js test --config=playwright.care-mobile-hierarchy.config.js
          node node_modules/@playwright/test/cli.js test --config=playwright.care-loading-feedback.config.js
          node node_modules/@playwright/test/cli.js test --config=playwright.care-navigation-continuity.config.js
          node node_modules/@playwright/test/cli.js test --config=playwright.care-overview.config.js
          node node_modules/@playwright/test/cli.js test --config=playwright.runtime-review.config.js

      - name: Run cross-device UI placement regression
        id: ui
        env:
          WAFFLE_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          set +e
          npm run test:ui:local
          test_exit=$?
          set -e
          echo "test_exit=$test_exit" >> "$GITHUB_OUTPUT"
          node scripts/summarize-ui-regression.js
          exit 0

      - name: Upload UI regression report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-device-ui-regression-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ui-regression-report.json
            ui-regression-summary.md
            playwright-report/
            test-results/

      - name: Fail workflow when UI regression fails
        if: steps.ui.outputs.test_exit != '0'
        run: |
          echo "One or more cross-device UI regression checks failed. See ui-regression-summary.md and the Playwright artifact for explanations, screenshots, traces and video."
          exit 1
