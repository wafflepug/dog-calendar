permissions:
  contents: read

concurrency:
  group: cross-device-ui-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install contract dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
      - name: Run Node contract checks
        run: |
          set -euo pipefail
          node --test tests/local-ui-runner.test.js
          node --test tests/local-network-policy.test.js
          node --test tests/waffle-bootstrap-lifecycle.test.js
          node --test tests/care-startup-priority.test.js tests/care-past-background-load.test.js tests/booking-plan.test.js tests/dog-record-cache-age.test.js tests/care-directory-refresh-rendering.test.js tests/care-decorator-observer.test.js tests/care-media-render-cache.test.js
          node --test tests/care-profile-readiness.test.js tests/care-overview-freshness.test.js tests/care-record-update-contract.test.js
          node --test tests/care-state-preservation.test.js tests/care-past-classification.test.js tests/stay-operation-frontend.test.js
          node --test tests/care-csv-integrity.test.js
          node --test tests/care-confirmed-reconciliation.test.js tests/confirmed-stay-identity.test.js tests/potential-confirm-dog-id.test.js tests/checkout-collision-safety.test.js
          node --test tests/system-status-sync.test.js
          node --test tests/system-status-release.test.js
          node --test tests/care-navigation-continuity.test.js
          node --test tests/care-return-focus-identity.test.js
          node --test tests/ui-workflow-parallel.test.js

  fixtures:
    name: Fixture suite (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: care-render-performance
            configs: playwright.care-render-performance.config.js
          - group: owner-workflows
            configs: playwright.owner-workflows.config.js
          - group: master-compact
            configs: playwright.care-master-compact.config.js
          - group: booking-plans
            configs: playwright.booking-plan.config.js
          - group: compact-controls
            configs: playwright.care-compact-controls.config.js
          - group: overview
            configs: playwright.care-overview.config.js
          - group: profiles-cleaner
            configs: playwright.care-cleaner-ui.config.js
          - group: profiles-detail
            configs: playwright.care-detailed-care-runtime.config.js
          - group: profiles-hierarchy
            configs: playwright.care-mobile-hierarchy.config.js
          - group: profiles-photos
            configs: playwright.care-photos.config.js
          - group: profiles-five
            configs: playwright.care-ui-five.config.js
          - group: profiles-clarity
            configs: playwright.care-ui-clarity.config.js
          - group: refinements
            configs: playwright.care-ui-refinements.config.js playwright.care-profile.config.js playwright.care-ui-polish.config.js playwright.care-roster.config.js playwright.returning-dogs.config.js
          - group: navigation
            configs: playwright.care-scroll-access.config.js playwright.care-loading-feedback.config.js playwright.care-navigation-accessibility.config.js
          - group: records
            configs: playwright.care-navigation-continuity.config.js tests/mvp-records-notifications.config.js playwright.mvp-observer.config.js playwright.runtime-review.config.js
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies and fixture browsers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Run fixture configurations
        env:
          FIXTURE_CONFIGS: ${{ matrix.configs }}
          FIXTURE_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          for config in $FIXTURE_CONFIGS; do
            name="${config##*/}"
            name="${name%.js}"
            node node_modules/@playwright/test/cli.js test --config="$config" --output="test-results/$FIXTURE_GROUP-$name"
          done
      - name: Upload fixture reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-fixtures-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ui-regression-report.json
            ui-regression-summary.md
            playwright-report/
            test-results/
            evidence/

  placement:
    name: Placement shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies and placement browsers
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Run cross-device UI placement regression
        env:
          WAFFLE_BASE_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          set +e
          npm run test:ui:local -- --shard=${{ matrix.shard }}/3
          test_exit=$?
          set -e
          node scripts/summarize-ui-regression.js
          exit "$test_exit"
      - name: Upload placement report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-device-ui-regression-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ui-regression-report.json
            ui-regression-summary.md
            playwright-report/
            test-results/

  ui-regression:
    name: ui-regression
    if: always()
    needs: [contracts, fixtures, placement]
    runs-on: ubuntu-latest
    steps:
      - name: Require all regression jobs to succeed
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          PLACEMENT_RESULT: ${{ needs.placement.result }}
        run: |
          set -euo pipefail
          if [[ "$CONTRACTS_RESULT" != success || "$FIXTURES_RESULT" != success || "$PLACEMENT_RESULT" != success ]]; then
            echo "Cross-device UI regression failed: contracts=$CONTRACTS_RESULT fixtures=$FIXTURES_RESULT placement=$PLACEMENT_RESULT"
            exit 1
          fi
