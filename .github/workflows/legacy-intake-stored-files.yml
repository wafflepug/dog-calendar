name: Legacy Intake Stored Files

on:
  pull_request:
    paths:
      - 'apps-script/V11205LegacyIntakeStoredFiles.js'
      - 'apps-script/V11206LegacyIntakeFreeOcr.js'
      - 'apps-script/V11207LegacyIntakePriority.js'
      - 'apps-script/LegacyIntake.html'
      - '.github/workflows/legacy-intake-stored-files.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/V11205LegacyIntakeStoredFiles.js'
      - 'apps-script/V11206LegacyIntakeFreeOcr.js'
      - 'apps-script/V11207LegacyIntakePriority.js'
      - 'apps-script/LegacyIntake.html'
      - '.github/workflows/legacy-intake-stored-files.yml'

permissions:
  contents: read

jobs:
  stored-file-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stored-file Apps Script helpers
        run: |
          set -euo pipefail
          node --check apps-script/V11205LegacyIntakeStoredFiles.js
          node --check apps-script/V11206LegacyIntakeFreeOcr.js
          node --check apps-script/V11207LegacyIntakePriority.js
          grep -q "function getLegacyIntakeStoredDocumentsForHtmlV11205" apps-script/V11205LegacyIntakeStoredFiles.js
          grep -q "documents.sort" apps-script/V11205LegacyIntakeStoredFiles.js
          grep -q "function getLegacyIntakeOcrSourceForHtmlV11206" apps-script/V11206LegacyIntakeFreeOcr.js
          grep -q "DriveApp.getFileById" apps-script/V11206LegacyIntakeFreeOcr.js
          grep -q "data:application/pdf;base64" apps-script/V11206LegacyIntakeFreeOcr.js
          grep -q "function retryLegacyIntakeAiPriorityV11207" apps-script/V11207LegacyIntakePriority.js
          grep -Fq "providerOrder = ['groq', 'gemini', 'tesseract']" apps-script/V11207LegacyIntakePriority.js

      - name: Validate stored-file priority OCR flow
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('apps-script/LegacyIntake.html', 'utf8');
          const matches = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          const inline = matches.map(match => match[1]).find(code => code.includes('INITIAL_STAY_KEY'));
          if (!inline) throw new Error('LegacyIntake.html application script not found');
          const js = inline
            .replace(/<\?!=\s*JSON\.stringify\(initialStayKey\)\s*\?>/g, '""')
            .replace(/<\?!=\s*JSON\.stringify\(initialDocumentId\)\s*\?>/g, '""');
          fs.writeFileSync('/tmp/legacy-intake-inline.js', js);
          if (!html.includes('OCR priority: 1. Groq → 2. Gemini → 3. Tesseract')) {
            throw new Error('Expected Groq -> Gemini -> Tesseract priority label');
          }
          if (!js.includes("serverCall('retryLegacyIntakeAiPriorityV11207'")) {
            throw new Error('Stored scanner must call the priority cloud bridge');
          }
          if (!js.includes('const prepared=await storedPrepared(documentId)')) {
            throw new Error('Stored PDF must be prepared for the cloud priority route');
          }
          if (!js.includes('return applyTesseract(documentId,prepared,reason)')) {
            throw new Error('Tesseract fallback must remain available after cloud failure');
          }
          NODE
          node --check /tmp/legacy-intake-inline.js
          grep -q "storedFileSelect" apps-script/LegacyIntake.html
          grep -q "Previously uploaded legacy intake" apps-script/LegacyIntake.html
          grep -q "Run OCR Again" apps-script/LegacyIntake.html
          grep -q "getLegacyIntakeStoredDocumentsForHtmlV11205" apps-script/LegacyIntake.html
          grep -q "switchStored" apps-script/LegacyIntake.html
          grep -q "getLegacyIntakeOcrSourceForHtmlV11206" apps-script/LegacyIntake.html
          grep -q "storedPrepared" apps-script/LegacyIntake.html
          grep -q "tesseractRead" apps-script/LegacyIntake.html
          grep -q "finalizeLegacyIntakeForSelectedBookingV11204" apps-script/LegacyIntake.html
