name: Active Code Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate authoritative Phase 3B runtime
        run: |
          set -euo pipefail
          node --check waffle-bootstrap.js
          node --check waffle-v11.0.5.js
          node --check calendar.js
          node --check care.js
          node --check organiser.js
          node --check logs.js
          node --check waffle-ui.js
          node --check waffle-ai.js
          node --check service-worker.js
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('waffle-build.json').read_text(encoding='utf-8'))
          build = str(manifest.get('build', '')).strip()
          assert build == '2026.08.27.04', 'unexpected canonical build id'
          assert manifest.get('runtime') == 'waffle-bootstrap.js'
          assert manifest.get('styles') == 'waffle-runtime.css'
          assert manifest.get('phase') == 'phase-3b-historical-source-cleanup'
          assert manifest.get('legacySourceDeletion') is True
          assert manifest.get('migrationToolingRetired') is True
          assert manifest.get('remainingLegacyAuditPending') is True

          canonical = {
              'calendar': 'calendar.js',
              'care': 'care.js',
              'organiser': 'organiser.js',
              'logs': 'logs.js',
              'ui': 'waffle-ui.js',
              'ai': 'waffle-ai.js',
          }
          assert manifest.get('canonicalModules') == canonical
          for path in canonical.values():
              assert Path(path).exists(), f'canonical module missing: {path}'
          assert Path('organiser.css').exists(), 'canonical Organiser styles missing'
          assert Path('waffle-ui-contract.js').exists(), 'UI contract reference missing'
          assert manifest.get('uiContractReference') == 'waffle-ui-contract.js'

          retired = [
              'waffle-v11.1.69.js','waffle-v11.1.66.js','waffle-v11.1.67.js',
              'waffle-v11.1.68.js','waffle-v11.1.70.js','waffle-v11.1.71.js',
              'waffle-v11.1.72.js','waffle-v11.1.73.js','waffle-v11.1.84.js',
              'waffle-v11.1.60.js','waffle-v11.1.15.js','waffle-v11.1.15.css',
              'waffle-v11.1.75.js','waffle-v11.1.76.js','waffle-v11.1.80.js','waffle-v11.1.89.js',
              'waffle-v11.1.37-assets.js','waffle-v11.1.53.js','waffle-v11.1.37.js',
              'waffle-v11.1.38.js','waffle-v11.1.39.js','waffle-v11.1.40.js',
              'waffle-v11.1.45.js','waffle-v11.1.47.js','waffle-v11.1.48.js','waffle-v11.1.58.js',
          ]
          assert manifest.get('removedHistoricalSources') == retired
          for source in retired:
              assert not Path(source).exists(), f'retired source returned: {source}'

          retired_tooling = [
              '.github/workflows/calendar-canonical-build.yml',
              '.github/workflows/care-canonical-build.yml',
              '.github/workflows/phase3a-canonical-build.yml',
              '.github/workflows/runtime-consolidation.yml',
              'scripts/build-calendar-canonical.py',
              'scripts/build-care-canonical.py',
              'scripts/build-phase3a-canonical.py',
              'scripts/patch-phase3a-canonical-v2.py',
              'scripts/phase3a-finalise.py',
              'scripts/consolidate-runtime.py',
              'scripts/consolidate-runtime-v2.py',
          ]
          for path in retired_tooling:
              assert not Path(path).exists(), f'retired migration tooling returned: {path}'

          pages = ['index.html','directory.html','reminders.html','audit.html']
          script_pattern = re.compile(
              r'<script\b[^>]*\bsrc=["\']((?:waffle-app|waffle-v(?:10|11)\.[^"\']+)\.js)(?:\?[^"\']*)?["\'][^>]*>',
              re.I,
          )
          style_pattern = re.compile(
              r'<link\b[^>]*\bhref=["\']((?:waffle-app|waffle-v(?:10|11)\.[^"\']+)\.css)(?:\?[^"\']*)?["\'][^>]*>',
              re.I,
          )
          for page in pages:
              text = Path(page).read_text(encoding='utf-8')
              assert text.count(f'waffle-bootstrap.js?v={build}') == 1, f'{page}: runtime pin mismatch'
              assert text.count(f'waffle-runtime.css?v={build}') == 1, f'{page}: style pin mismatch'
              assert not script_pattern.findall(text), f'{page}: direct historical JS tag remains'
              assert not style_pattern.findall(text), f'{page}: direct historical CSS tag remains'

          bootstrap = Path('waffle-bootstrap.js').read_text(encoding='utf-8')
          approved_base = [
              'waffle-firebase-config.js','waffle-app.js','waffle-v10.8.js',
              'waffle-v10.8.2.js','waffle-v10.8.3.js','waffle-v10.8.5.js',
              'waffle-v10.8.6.js','waffle-v10.8.8.js','waffle-v10.8.9.js',
              'waffle-v11.0.js','waffle-v11.0.4.js','waffle-v11.0.5.js',
          ]
          assert manifest.get('retainedCompatibilitySources') == approved_base
          for required in approved_base:
              assert f'"{required}"' in bootstrap, f'bootstrap missing approved compatibility source: {required}'
              assert Path(required).exists(), f'approved compatibility source missing: {required}'
          assert f"const BUILD = '{build}'" in bootstrap
          assert 'waffle-build.json?_=' in bootstrap
          assert 'action=maintenance_status' in bootstrap

          compatibility = Path('waffle-v11.0.5.js').read_text(encoding='utf-8')
          feature_loaders = {
              'calendar': ('ensureCleanCalendar', 'calendar.js', 'WAFFLE_CALENDAR_CANONICAL'),
              'care': ('ensureDesktopCareRebuild', 'care.js', 'WAFFLE_CARE_CANONICAL'),
              'organiser': ('ensureOrganiser', 'organiser.js', 'WAFFLE_ORGANISER_CANONICAL'),
              'logs': ('ensureLogs', 'logs.js', 'WAFFLE_LOGS_CANONICAL'),
              'ui': ('ensureSharedUi', 'waffle-ui.js', 'WAFFLE_UI_CANONICAL'),
              'ai': ('ensureAskWaffle', 'waffle-ai.js', 'WAFFLE_AI_CANONICAL'),
          }
          for label, (function_name, filename, marker) in feature_loaders.items():
              match = re.search(rf'async function {function_name}\(\) \{{(.*?)\n  \}}', compatibility, re.S)
              assert match, f'{function_name}() missing'
              body = match.group(1)
              assert repr(filename) in body or f'"{filename}"' in body, f'{label}: canonical filename missing'
              assert marker in body, f'{label}: canonical marker missing'
          for source in retired:
              assert source not in compatibility, f'retired source reactivated in compatibility loader: {source}'
          assert 'V11.1.90 — CANONICAL CARE PDF OCR ACTION' in compatibility

          checks = {
              'calendar.js': ['WAFFLE_CALENDAR_CANONICAL','v11166MobileMeetVersion','v11168CapacityHealthVersion','v11172MeetOutlookAlignmentVersion'],
              'care.js': ['WAFFLE_CARE_CANONICAL','v11160DesktopCareRebuildVersion'],
              'organiser.js': ['WAFFLE_ORGANISER_CANONICAL','save_organiser_item','get_organiser'],
              'logs.js': ['WAFFLE_LOGS_CANONICAL',"dataOwner: 'waffle-app.js'"],
              'waffle-ui.js': ['WAFFLE_UI_CANONICAL','WAFFLE_UI_CONTRACT','v11175MobileSitterShellVersion','v11189MobileQuickActionCompletionVersion'],
              'waffle-ai.js': ['WAFFLE_AI_CANONICAL','v11138WaffleAiVersion','v11147WaffleAiVersion','v11148WaffleAiVersion','v11158WaffleSpeechVersion'],
          }
          for filename, markers in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              for marker in markers:
                  assert marker in text, f'{filename}: migrated behavior marker missing: {marker}'

          worker = Path('service-worker.js').read_text(encoding='utf-8')
          assert f'v11.3.0-phase3a-{build}' in worker
          assert "fetch(request, { cache: 'no-store' })" in worker
          shell_match = re.search(r'const APP_SHELL = \[(.*?)\n\];', worker, re.S)
          assert shell_match, 'service worker APP_SHELL missing'
          shell = shell_match.group(1)
          for name in ['waffle-bootstrap.js','waffle-runtime.css','waffle-build.json','calendar.js','care.js','organiser.js','organiser.css','logs.js','waffle-ui.js','waffle-ai.js']:
              assert name in shell, f'app shell missing canonical asset: {name}'
          assert 'waffle-v10.' not in shell and 'waffle-v11.' not in shell, 'historical version file is pre-cached'

          runtime_map = Path('docs/runtime-map.md').read_text(encoding='utf-8')
          assert 'Phase 3B' in runtime_map
          assert 'remainingLegacyAuditPending' in runtime_map
          for name in canonical.values():
              assert name in runtime_map, f'runtime map missing {name}'

          print('Active Waffle runtime contract passed · Phase 3B cleanup · build', build)
          PY
