name: Active Code Contract

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate authoritative runtime
        run: |
          node --check waffle-bootstrap.js
          node --check waffle-v11.0.5.js
          node --check calendar.js
          node --check care.js
          node --check service-worker.js
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          pages = ['index.html', 'directory.html', 'reminders.html', 'audit.html']
          manifest = json.loads(Path('waffle-build.json').read_text(encoding='utf-8'))
          build = str(manifest.get('build', '')).strip()
          assert build, 'waffle-build.json must contain a build id'
          assert manifest.get('runtime') == 'waffle-bootstrap.js'
          assert manifest.get('styles') == 'waffle-runtime.css'
          assert manifest.get('phase') == 'canonical-source-consolidation-2-care'
          assert manifest.get('canonicalModules', {}).get('calendar') == 'calendar.js'
          assert manifest.get('canonicalModules', {}).get('care') == 'care.js'
          assert manifest.get('legacySourceDeletion') is False

          expected_calendar_sources = [
              'waffle-v11.1.69.js',
              'waffle-v11.1.66.js',
              'waffle-v11.1.67.js',
              'waffle-v11.1.68.js',
              'waffle-v11.1.70.js',
              'waffle-v11.1.71.js',
              'waffle-v11.1.72.js',
              'waffle-v11.1.73.js',
              'waffle-v11.1.84.js',
          ]
          assert manifest.get('legacyCalendarSources') == expected_calendar_sources
          for source in expected_calendar_sources:
              assert Path(source).exists(), f'rollback Calendar source missing: {source}'

          expected_care_sources = ['waffle-v11.1.60.js']
          assert manifest.get('legacyCareSources') == expected_care_sources
          for source in expected_care_sources:
              assert Path(source).exists(), f'rollback Care source missing: {source}'

          script_pattern = re.compile(
              r'<script\b[^>]*\bsrc=["\']((?:waffle-app|waffle-v(?:10|11)\.[^"\']+)\.js)(?:\?[^"\']*)?["\'][^>]*>',
              re.I,
          )
          style_pattern = re.compile(
              r'<link\b[^>]*\bhref=["\']((?:waffle-app|waffle-v(?:10|11)\.[^"\']+)\.css)(?:\?[^"\']*)?["\'][^>]*>',
              re.I,
          )

          for page in pages:
              text = Path(page).read_text(encoding='utf-8')
              expected_js = f'waffle-bootstrap.js?v={build}'
              expected_css = f'waffle-runtime.css?v={build}'
              assert text.count(expected_js) == 1, f'{page}: expected exactly one {expected_js}'
              assert text.count(expected_css) == 1, f'{page}: expected exactly one {expected_css}'
              assert not script_pattern.findall(text), f'{page}: direct legacy JS tag remains: {script_pattern.findall(text)}'
              assert not style_pattern.findall(text), f'{page}: direct legacy CSS tag remains: {style_pattern.findall(text)}'

          bootstrap = Path('waffle-bootstrap.js').read_text(encoding='utf-8')
          for required in [
              'waffle-firebase-config.js', 'waffle-app.js', 'waffle-v10.8.js',
              'waffle-v10.8.2.js', 'waffle-v10.8.3.js', 'waffle-v10.8.5.js',
              'waffle-v10.8.6.js', 'waffle-v10.8.8.js', 'waffle-v10.8.9.js',
              'waffle-v11.0.js', 'waffle-v11.0.4.js', 'waffle-v11.0.5.js'
          ]:
              assert f'"{required}"' in bootstrap, f'bootstrap missing approved runtime module {required}'
              assert Path(required).exists(), f'approved runtime module missing from repository: {required}'
          assert f"const BUILD = '{build}'" in bootstrap
          assert 'waffle-build.json?_=' in bootstrap
          assert 'A newer Waffle House is ready.' in bootstrap
          assert 'action=maintenance_status' in bootstrap

          compatibility = Path('waffle-v11.0.5.js').read_text(encoding='utf-8')
          clean_calendar = re.search(
              r'async function ensureCleanCalendar\(\) \{(.*?)\n  \}',
              compatibility,
              re.S,
          )
          assert clean_calendar, 'ensureCleanCalendar() not found'
          calendar_loader = clean_calendar.group(1)
          assert "'calendar.js'" in calendar_loader
          assert 'WAFFLE_CALENDAR_CANONICAL' in calendar_loader
          assert "'waffle-v11.1.61.js'" not in calendar_loader, 'legacy Calendar bridge is active again'

          clean_care = re.search(
              r'async function ensureDesktopCareRebuild\(\) \{(.*?)\n  \}',
              compatibility,
              re.S,
          )
          assert clean_care, 'ensureDesktopCareRebuild() not found'
          care_loader = clean_care.group(1)
          assert "'care.js'" in care_loader
          assert 'WAFFLE_CARE_CANONICAL' in care_loader
          assert "'waffle-v11.1.60.js'" not in care_loader, 'legacy Care source is active again'

          calendar = Path('calendar.js').read_text(encoding='utf-8')
          assert 'WAFFLE HOUSE — CANONICAL CALENDAR MODULE' in calendar
          assert 'WAFFLE_CALENDAR_CANONICAL' in calendar
          assert f"build: '{build}'" in calendar
          for source in expected_calendar_sources:
              assert f'CANONICAL CALENDAR SOURCE · {source}' in calendar, f'canonical Calendar missing {source}'

          care = Path('care.js').read_text(encoding='utf-8')
          assert 'WAFFLE HOUSE — CANONICAL CARE / GUEST DIRECTORY MODULE' in care
          assert 'WAFFLE_CARE_CANONICAL' in care
          assert f"build: '{build}'" in care
          for source in expected_care_sources:
              assert f'CANONICAL CARE SOURCE · {source}' in care, f'canonical Care missing {source}'
          assert 'v11160DesktopCareRebuildVersion' in care

          runtime_css = Path('waffle-runtime.css').read_text(encoding='utf-8')
          assert f'Build: {build}' in runtime_css
          for required in ['waffle-app.css','waffle-v10.8.css','waffle-v11.0.5.css']:
              assert required in runtime_css
              assert Path(required).exists(), f'approved stylesheet missing: {required}'

          worker = Path('service-worker.js').read_text(encoding='utf-8')
          assert f'v11.2.2-care-{build}' in worker
          assert "fetch(request, { cache: 'no-store' })" in worker
          shell_match = re.search(r'const APP_SHELL = \[(.*?)\n\];', worker, re.S)
          assert shell_match, 'service worker APP_SHELL not found'
          shell = shell_match.group(1)
          assert 'waffle-bootstrap.js' in shell
          assert 'waffle-runtime.css' in shell
          assert 'waffle-build.json' in shell
          assert f'calendar.js?build={build}' in shell
          assert f'care.js?build={build}' in shell
          assert 'waffle-v10.' not in shell and 'waffle-v11.' not in shell, 'legacy version file remains pre-cached'

          print('Active Waffle runtime contract passed · canonical Calendar + Care · build', build)
          PY
