name: Bootstrap Waffle Maintenance Safety

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/maintenance-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install maintenance safety infrastructure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          maintenance_html = r'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="theme-color" content="#111827">
            <title>Waffle House — Maintenance</title>
            <style>
              :root {
                color-scheme: light dark;
                --purple:#7c3aed;
                --purple-dark:#5b21b6;
                --ink:#172033;
                --muted:#64748b;
                --surface:rgba(255,255,255,.96);
                --line:rgba(148,163,184,.28);
              }
              * { box-sizing:border-box; }
              html,body { min-height:100%; }
              body {
                margin:0;
                min-height:100vh;
                min-height:100dvh;
                display:grid;
                place-items:center;
                padding:24px 14px;
                background:
                  radial-gradient(circle at 50% 4%, rgba(168,85,247,.24), transparent 34%),
                  linear-gradient(155deg,#0f172a 0%,#111827 48%,#1e1b4b 100%);
                color:#f8fafc;
                font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
              }
              .shell {
                width:min(720px,100%);
                text-align:center;
              }
              .avatar-wrap {
                position:relative;
                width:min(560px,92vw);
                margin:0 auto -22px;
                z-index:2;
              }
              .avatar {
                display:block;
                width:100%;
                height:auto;
                filter:drop-shadow(0 24px 34px rgba(0,0,0,.38));
              }
              .card {
                position:relative;
                z-index:3;
                padding:34px 28px 28px;
                border:1px solid rgba(255,255,255,.15);
                border-radius:26px;
                background:rgba(15,23,42,.78);
                box-shadow:0 28px 70px rgba(0,0,0,.34);
                backdrop-filter:blur(18px);
              }
              .eyebrow {
                display:inline-flex;
                align-items:center;
                gap:7px;
                margin-bottom:12px;
                padding:7px 11px;
                border:1px solid rgba(196,181,253,.30);
                border-radius:999px;
                background:rgba(124,58,237,.18);
                color:#ddd6fe;
                font-size:10px;
                font-weight:900;
                letter-spacing:.12em;
                text-transform:uppercase;
              }
              h1 {
                margin:0;
                font-size:clamp(28px,5vw,43px);
                line-height:1.02;
                letter-spacing:-.04em;
              }
              .dog-line {
                max-width:600px;
                margin:16px auto 0;
                color:#f8fafc;
                font-size:clamp(15px,2.5vw,18px);
                line-height:1.55;
                font-weight:750;
              }
              .safety {
                max-width:560px;
                margin:15px auto 0;
                color:#cbd5e1;
                font-size:12px;
                line-height:1.55;
              }
              .message {
                display:none;
                max-width:560px;
                margin:14px auto 0;
                padding:10px 12px;
                border:1px solid rgba(251,191,36,.24);
                border-radius:12px;
                background:rgba(120,53,15,.22);
                color:#fde68a;
                font-size:11px;
                line-height:1.45;
              }
              .message.show { display:block; }
              .actions {
                display:flex;
                justify-content:center;
                gap:9px;
                flex-wrap:wrap;
                margin-top:22px;
              }
              button {
                min-height:44px;
                border:0;
                border-radius:13px;
                padding:10px 17px;
                background:linear-gradient(135deg,#8b5cf6,#6d28d9);
                color:white;
                box-shadow:0 9px 24px rgba(124,58,237,.28);
                font:inherit;
                font-size:12px;
                font-weight:900;
                cursor:pointer;
              }
              button:disabled { opacity:.6; cursor:wait; }
              .auto {
                margin-top:13px;
                color:#94a3b8;
                font-size:10px;
                font-weight:700;
              }
              .brand {
                margin-top:17px;
                color:#c4b5fd;
                font-size:10px;
                font-weight:900;
                letter-spacing:.08em;
                text-transform:uppercase;
              }
              @media (max-width:560px) {
                body { padding:15px 8px; }
                .avatar-wrap { width:min(430px,100vw); margin-bottom:-15px; }
                .card { padding:28px 16px 22px; border-radius:21px; }
                .dog-line { font-size:15px; }
              }
            </style>
          </head>
          <body>
            <main class="shell" aria-labelledby="maintenanceTitle">
              <div class="avatar-wrap">
                <img class="avatar" src="waffle-maintenance.webp?v=11.1.91" alt="Waffle looking sadly at an unplugged server">
              </div>
              <section class="card">
                <div class="eyebrow"><span aria-hidden="true">🐾</span> Maintenance mode</div>
                <h1 id="maintenanceTitle">Waffle House is having a little ruff patch.</h1>
                <p class="dog-line">Waffle may have chewed the server cable. We’re fetching a fresh one, untangling the leads and giving the database a very serious belly rub.</p>
                <p class="safety">Updates are temporarily paused to protect boarding data while improvements are being deployed. Nothing needs to be re-entered — please try again shortly.</p>
                <div id="maintenanceMessage" class="message"></div>
                <div class="actions">
                  <button id="retryBtn" type="button">🐶 Check Waffle House Again</button>
                </div>
                <div id="autoText" class="auto">Checking automatically every 20 seconds.</div>
                <div class="brand">Waffle Boarding House</div>
              </section>
            </main>
            <script>
              (() => {
                'use strict';
                const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec';
                const params = new URLSearchParams(location.search);
                const retry = document.getElementById('retryBtn');
                const messageBox = document.getElementById('maintenanceMessage');
                const autoText = document.getElementById('autoText');
                let checking = false;

                function safeReturnTarget() {
                  const raw = String(params.get('from') || 'index.html').trim();
                  if (!raw || /^https?:/i.test(raw) || raw.startsWith('//') || raw.includes('maintenance.html')) return 'index.html';
                  return raw;
                }

                function showMessage(text) {
                  const value = String(text || '').trim();
                  messageBox.textContent = value;
                  messageBox.classList.toggle('show', !!value);
                }

                function checkStatus(manual) {
                  if (checking) return;
                  checking = true;
                  retry.disabled = true;
                  retry.textContent = '🐾 Sniffing the server…';
                  if (manual) showMessage('Checking whether Waffle has finished fixing things…');

                  const callbackName = '__waffleMaintenancePage' + Date.now() + Math.floor(Math.random() * 10000);
                  const script = document.createElement('script');
                  let settled = false;

                  function finish() {
                    if (settled) return;
                    settled = true;
                    checking = false;
                    retry.disabled = false;
                    retry.textContent = '🐶 Check Waffle House Again';
                    try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
                    script.remove();
                  }

                  window[callbackName] = status => {
                    const enabled = status && status.enabled === true;
                    if (!enabled) {
                      finish();
                      location.replace(safeReturnTarget());
                      return;
                    }
                    showMessage(status && status.message ? status.message : 'Maintenance is still in progress. Waffle is working on it.');
                    autoText.textContent = 'Still in maintenance mode · checking automatically every 20 seconds.';
                    finish();
                  };

                  script.onerror = () => {
                    showMessage('Waffle still cannot reach the kennel computer. We’ll keep checking.');
                    finish();
                  };

                  script.src = ENDPOINT + '?action=maintenance_status&callback=' + encodeURIComponent(callbackName) + '&_=' + Date.now();
                  document.head.appendChild(script);
                  setTimeout(() => {
                    if (!settled) {
                      showMessage('The server is still busy. Waffle will try again shortly.');
                      finish();
                    }
                  }, 8000);
                }

                retry.addEventListener('click', () => checkStatus(true));
                checkStatus(false);
                setInterval(() => checkStatus(false), 20000);
              })();
            </script>
          </body>
          </html>
          '''

          maintenance_backend = r'''/* ============================================================
           * WAFFLE HOUSE V11.1.91 — MAINTENANCE SAFETY MODE
           * ------------------------------------------------------------
           * The code default is the deployment switch used by ChatGPT during
           * release work. Set true in a dedicated maintenance commit, wait for
           * Apps Script deployment, make changes, then set false only after
           * validation. A Script Property can override the code default when
           * an operator needs an emergency switch from Apps Script itself.
           * ============================================================ */
          var WAFFLE_MAINTENANCE_DEFAULT_ = true;
          var WAFFLE_MAINTENANCE_PROPERTY_ = 'WAFFLE_MAINTENANCE_MODE';
          var WAFFLE_MAINTENANCE_MESSAGE_PROPERTY_ = 'WAFFLE_MAINTENANCE_MESSAGE';
          var WAFFLE_MAINTENANCE_UPDATED_PROPERTY_ = 'WAFFLE_MAINTENANCE_UPDATED_AT';
          var WAFFLE_MAINTENANCE_PAGE_URL_ = 'https://wafflepug.github.io/dog-calendar/maintenance.html';

          function parseWaffleMaintenanceBoolean_(value, fallback) {
            var text = String(value === null || value === undefined ? '' : value).trim().toLowerCase();
            if (!text) return fallback === true;
            if (['1','true','yes','on','enabled'].indexOf(text) !== -1) return true;
            if (['0','false','no','off','disabled'].indexOf(text) !== -1) return false;
            return fallback === true;
          }

          function getWaffleMaintenanceStatus_() {
            var properties = PropertiesService.getScriptProperties();
            var override = properties.getProperty(WAFFLE_MAINTENANCE_PROPERTY_);
            var enabled = parseWaffleMaintenanceBoolean_(override, WAFFLE_MAINTENANCE_DEFAULT_);
            var customMessage = String(properties.getProperty(WAFFLE_MAINTENANCE_MESSAGE_PROPERTY_) || '').trim();
            var updatedAt = String(properties.getProperty(WAFFLE_MAINTENANCE_UPDATED_PROPERTY_) || '').trim();

            return {
              result: 'success',
              action: 'maintenance_status',
              version: '11.1.91',
              enabled: enabled,
              message: customMessage || (enabled
                ? 'Waffle House is temporarily down for maintenance. Updates are paused to protect your data.'
                : ''),
              updatedAt: updatedAt,
              source: override === null ? 'code-default' : 'script-property'
            };
          }

          function getWaffleMaintenanceStatus() {
            return getWaffleMaintenanceStatus_();
          }

          function isWaffleMaintenanceMode_() {
            return getWaffleMaintenanceStatus_().enabled === true;
          }

          function isWaffleMaintenanceReadOnlyAction_(action) {
            var name = String(action || '').trim();
            if (!name) return false;
            if (name === 'maintenance_status' || name === 'health' || name === 'waffle_ai_health') return true;
            try {
              if (typeof isReadOnlySheetAction_ === 'function' && isReadOnlySheetAction_(name)) return true;
            } catch (_) {}
            return false;
          }

          function assertWaffleActionAllowedDuringMaintenance_(action) {
            if (!isWaffleMaintenanceMode_()) return true;
            if (isWaffleMaintenanceReadOnlyAction_(action)) return true;
            throw new Error(
              'Waffle House is temporarily in maintenance mode. Updates are paused to protect boarding data. Please try again when maintenance is complete.'
            );
          }

          function enableWaffleMaintenanceMode(message) {
            var properties = PropertiesService.getScriptProperties();
            properties.setProperty(WAFFLE_MAINTENANCE_PROPERTY_, 'true');
            properties.setProperty(
              WAFFLE_MAINTENANCE_MESSAGE_PROPERTY_,
              String(message || 'Waffle House is temporarily down for maintenance. Updates are paused to protect your data.').trim()
            );
            properties.setProperty(WAFFLE_MAINTENANCE_UPDATED_PROPERTY_, new Date().toISOString());
            return getWaffleMaintenanceStatus_();
          }

          function disableWaffleMaintenanceMode() {
            var properties = PropertiesService.getScriptProperties();
            properties.setProperty(WAFFLE_MAINTENANCE_PROPERTY_, 'false');
            properties.deleteProperty(WAFFLE_MAINTENANCE_MESSAGE_PROPERTY_);
            properties.setProperty(WAFFLE_MAINTENANCE_UPDATED_PROPERTY_, new Date().toISOString());
            return getWaffleMaintenanceStatus_();
          }

          function clearWaffleMaintenanceOverride() {
            var properties = PropertiesService.getScriptProperties();
            properties.deleteProperty(WAFFLE_MAINTENANCE_PROPERTY_);
            properties.deleteProperty(WAFFLE_MAINTENANCE_MESSAGE_PROPERTY_);
            properties.setProperty(WAFFLE_MAINTENANCE_UPDATED_PROPERTY_, new Date().toISOString());
            return getWaffleMaintenanceStatus_();
          }

          function buildWaffleMaintenanceRedirectHtml_() {
            var target = WAFFLE_MAINTENANCE_PAGE_URL_;
            var safeTarget = target.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
            return HtmlService.createHtmlOutput(
              '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
              '<meta http-equiv="refresh" content="0;url=' + safeTarget + '"><title>Waffle House — Maintenance</title></head>' +
              '<body style="font-family:system-ui,sans-serif;background:#111827;color:#fff;text-align:center;padding:40px">' +
              '<p>Waffle House is in maintenance mode.</p><p><a style="color:#c4b5fd" href="' + safeTarget + '">Open maintenance page</a></p>' +
              '<script>location.replace(' + JSON.stringify(target) + ');<\/script></body></html>'
            ).setTitle('Waffle House — Maintenance');
          }
          '''

          maintenance_guard = r'''name: Maintenance Safety Contract

          on:
            push:
              branches: [main]
            pull_request:

          jobs:
            guard:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Verify maintenance protections
                  run: |
                    set -euo pipefail
                    test -f maintenance.html
                    test -f waffle-maintenance.webp
                    test -f apps-script/MaintenanceMode.js
                    grep -q 'V11.1.91 — MAINTENANCE GATE' waffle-v11.0.5.js
                    grep -q 'maintenance_status' apps-script/Code.js
                    grep -q 'assertWaffleActionAllowedDuringMaintenance_' apps-script/Code.js
                    grep -q 'WAFFLE_MAINTENANCE_DEFAULT_' apps-script/MaintenanceMode.js
                    grep -q 'waffle-maintenance.webp' service-worker.js
                    echo 'Maintenance redirect, write lock and outage page are present.'
          '''

          gate = r'''/* ============================================================
             WAFFLE HOUSE V11.1.91 — MAINTENANCE GATE
             ------------------------------------------------------------
             Checks the authoritative Apps Script maintenance switch before the
             shared UI hydrates. While status is pending, interaction is blocked.
             If maintenance is enabled — or the safety status cannot be confirmed
             within the timeout — users are sent to maintenance.html.
             ============================================================ */
          (function () {
            'use strict';
            if (window.WAFFLE_MAINTENANCE_GATE) return;

            const VERSION = '11.1.91';
            const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec';
            const maintenanceUrl = new URL('maintenance.html', window.location.href);

            if (/\/maintenance\.html$/i.test(window.location.pathname)) return;

            const style = document.createElement('style');
            style.id = 'waffleMaintenanceGateStyle';
            style.textContent = 'html[data-waffle-maintenance-check="pending"] body{pointer-events:none!important;user-select:none!important;}';
            (document.head || document.documentElement).appendChild(style);
            document.documentElement.setAttribute('data-waffle-maintenance-check', 'pending');

            let settled = false;
            let timer = 0;
            const callbackName = '__waffleMaintenanceGate' + Date.now() + Math.floor(Math.random() * 10000);
            const script = document.createElement('script');

            function clean() {
              if (timer) clearTimeout(timer);
              try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
              script.remove();
            }

            function unlock() {
              if (settled) return;
              settled = true;
              clean();
              document.documentElement.removeAttribute('data-waffle-maintenance-check');
              style.remove();
              window.dispatchEvent(new CustomEvent('waffle:maintenance-clear'));
            }

            function redirect(reason) {
              if (settled) return;
              settled = true;
              clean();
              const from = window.location.pathname + window.location.search + window.location.hash;
              maintenanceUrl.searchParams.set('from', from);
              if (reason) maintenanceUrl.searchParams.set('reason', reason);
              window.location.replace(maintenanceUrl.href);
            }

            window[callbackName] = status => {
              if (status && status.enabled === true) {
                redirect('maintenance');
                return;
              }
              if (status && status.result === 'success') {
                unlock();
                return;
              }
              redirect('status-unconfirmed');
            };

            script.onerror = () => redirect('status-unavailable');
            script.src = ENDPOINT + '?action=maintenance_status&callback=' + encodeURIComponent(callbackName) + '&_=' + Date.now();
            (document.head || document.documentElement).appendChild(script);
            timer = setTimeout(() => redirect('status-timeout'), 6500);

            window.WAFFLE_MAINTENANCE_GATE = Object.freeze({
              version: VERSION,
              endpoint: ENDPOINT
            });
          })();

          '''

          Path('maintenance.html').write_text(textwrap.dedent(maintenance_html).lstrip(), encoding='utf-8')
          Path('apps-script/MaintenanceMode.js').write_text(textwrap.dedent(maintenance_backend).lstrip(), encoding='utf-8')
          Path('.github/workflows/maintenance-guard.yml').write_text(textwrap.dedent(maintenance_guard).lstrip(), encoding='utf-8')

          loader_path = Path('waffle-v11.0.5.js')
          loader = loader_path.read_text(encoding='utf-8')
          gate_text = textwrap.dedent(gate).lstrip()
          if 'V11.1.91 — MAINTENANCE GATE' not in loader:
            loader_path.write_text(gate_text + loader, encoding='utf-8')

          code_path = Path('apps-script/Code.js')
          code = code_path.read_text(encoding='utf-8')

          do_get_anchor = '  try {\n    // Serve the photo uploader itself from Apps Script.'
          do_get_insert = '''  try {\n    var requestedAction = e && e.parameter ? String(e.parameter.action || "").trim() : "";\n\n    if (requestedAction === "maintenance_status") {\n      var maintenanceStatus = getWaffleMaintenanceStatus_();\n      return callback\n        ? javascriptResponse_(callback, maintenanceStatus)\n        : jsonResponse_(maintenanceStatus);\n    }\n\n    if (\n      isWaffleMaintenanceMode_() &&\n      ["photo_uploader", "intake", "legacy_intake"].indexOf(requestedAction) !== -1\n    ) {\n      return buildWaffleMaintenanceRedirectHtml_();\n    }\n\n    // Serve the photo uploader itself from Apps Script.'''
          if 'requestedAction === "maintenance_status"' not in code:
            if do_get_anchor not in code:
              raise SystemExit('Could not locate doGet maintenance insertion point')
            code = code.replace(do_get_anchor, do_get_insert, 1)

          parsed_anchor = '    var data = JSON.parse(e.parameter.payload);\n'
          parsed_insert = parsed_anchor + '\n    assertWaffleActionAllowedDuringMaintenance_(data && data.action);\n'
          if parsed_insert not in code:
            if parsed_anchor not in code:
              raise SystemExit('Could not locate doGet payload assertion point')
            code = code.replace(parsed_anchor, parsed_insert, 1)

          post_anchor = '    if (\n      data.action === "upload_belongings_photo" &&\n'
          post_insert = '    assertWaffleActionAllowedDuringMaintenance_(data && data.action);\n\n' + post_anchor
          if post_insert not in code:
            if post_anchor not in code:
              raise SystemExit('Could not locate doPost assertion point')
            code = code.replace(post_anchor, post_insert, 1)

          core_pattern = re.compile(r'(function\s+processSheetActionWithV108Receipt_\s*\(\s*data\s*\)\s*\{)', re.S)
          if 'function processSheetActionWithV108Receipt_' in code and 'processSheetActionWithV108Receipt_(data) {\n  assertWaffleActionAllowedDuringMaintenance_' not in code:
            code, count = core_pattern.subn(r'\1\n  assertWaffleActionAllowedDuringMaintenance_(data && data.action);', code, count=1)
            if count != 1:
              raise SystemExit('Could not guard processSheetActionWithV108Receipt_')

          mutation_verbs = ('save','upload','apply','reassign','retry','delete','update','create','submit','complete','remove')
          function_pattern = re.compile(r'function\s+([A-Za-z0-9_]+)\s*\((.*?)\)\s*\{', re.S)
          matches = list(function_pattern.finditer(code))
          for match in reversed(matches):
            name = match.group(1)
            lowered = name.lower()
            if 'fromhtml' not in lowered:
              continue
            if not any(lowered.startswith(verb) for verb in mutation_verbs):
              continue
            guard_line = '  assertWaffleActionAllowedDuringMaintenance_("' + name + '");\n'
            after = match.end()
            if code[after:after + 220].find('assertWaffleActionAllowedDuringMaintenance_') != -1:
              continue
            code = code[:after] + '\n' + guard_line + code[after:]

          code_path.write_text(code, encoding='utf-8')

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(
            r"const WAFFLE_SW_VERSION = '[^']+';",
            "const WAFFLE_SW_VERSION = 'v11.1.91-maintenance-safety';",
            sw,
            count=1
          )
          if "'./maintenance.html'" not in sw:
            sw = sw.replace(
              "  './audit.html',\n",
              "  './audit.html',\n  './maintenance.html',\n  './waffle-maintenance.webp?v=11.1.91',\n",
              1
            )
          sw_path.write_text(sw, encoding='utf-8')

          print('Maintenance safety infrastructure installed.')
          PY

      - name: Validate generated files
        run: |
          set -euo pipefail
          test -s maintenance.html
          test -s apps-script/MaintenanceMode.js
          test -s waffle-maintenance.webp
          node --check waffle-v11.0.5.js
          grep -q 'maintenance_status' apps-script/Code.js
          grep -q 'assertWaffleActionAllowedDuringMaintenance_' apps-script/Code.js
          grep -q 'v11.1.91-maintenance-safety' service-worker.js

      - name: Commit maintenance infrastructure
        run: |
          set -euo pipefail
          git config user.name 'wafflepug'
          git config user.email 'actions@users.noreply.github.com'
          git add maintenance.html waffle-v11.0.5.js service-worker.js apps-script/Code.js apps-script/MaintenanceMode.js .github/workflows/maintenance-guard.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Install Waffle maintenance safety mode'
          git push origin HEAD:main
