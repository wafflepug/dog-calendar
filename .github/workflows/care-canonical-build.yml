name: Build Canonical Care

on:
  push:
    branches:
      - main
    paths:
      - scripts/build-care-canonical.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-care:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical Care module
        run: python3 scripts/build-care-canonical.py

      - name: Validate canonical Care JavaScript and contracts
        run: |
          node --check care.js
          node --check calendar.js
          node --check waffle-v11.0.5.js
          node --check waffle-bootstrap.js
          node --check service-worker.js
          grep -q "WAFFLE_CARE_CANONICAL" care.js
          grep -q "care.js" waffle-v11.0.5.js
          python3 scripts/check-ui-stability.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('waffle-v11.0.5.js').read_text(encoding='utf-8')
          match = re.search(r"async function ensureDesktopCareRebuild\(\) \{(.*?)\n  \}", text, re.S)
          assert match, 'ensureDesktopCareRebuild() missing'
          assert "'care.js'" in match.group(1)
          assert 'WAFFLE_CARE_CANONICAL' in match.group(1)
          assert 'waffle-v11.1.60.js' not in match.group(1), 'legacy Care source is still active'
          PY

      - name: Commit generated canonical runtime
        run: |
          if git diff --quiet -- \
            care.js \
            calendar.js \
            waffle-v11.0.5.js \
            waffle-bootstrap.js \
            waffle-runtime.css \
            waffle-build.json \
            service-worker.js \
            index.html \
            directory.html \
            reminders.html \
            audit.html \
            scripts/check-ui-stability.py; then
            echo "Canonical Care runtime is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            care.js \
            calendar.js \
            waffle-v11.0.5.js \
            waffle-bootstrap.js \
            waffle-runtime.css \
            waffle-build.json \
            service-worker.js \
            index.html \
            directory.html \
            reminders.html \
            audit.html \
            scripts/check-ui-stability.py
          git commit -m "Build canonical Care runtime"
          git push origin HEAD:main
