name: Release A R&D Contract

on:
  push:
    branches:
      - release-a-rnd
    paths:
      - 'rnd/**'
      - 'supabase/**'
      - 'docs/release-a-rnd.md'
      - '.github/workflows/release-a-rnd-contract.yml'
  pull_request:
    paths:
      - 'rnd/**'
      - 'supabase/**'
      - 'docs/release-a-rnd.md'
      - '.github/workflows/release-a-rnd-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check R&D clients
        run: |
          set -euo pipefail
          node --check rnd/app.js
          node --check rnd/config.js
          node --check rnd/operational-core.js
          node --check rnd/operational-render.js
          node --check rnd/operational-actions.js

      - name: Verify R&D environment guard
        run: |
          set -euo pipefail
          grep -q "environment: 'rnd'" rnd/config.js
          grep -q "config.environment === 'rnd'" rnd/app.js
          grep -q 'NOT WAFFLE HOUSE PRODUCTION' rnd/index.html
          grep -q 'rnd-preview' rnd/config.js
          grep -q 'operational-core.js' rnd/config.js
          grep -q 'operational-render.js' rnd/config.js
          grep -q 'operational-actions.js' rnd/config.js
          ! grep -R -E "sb_secret_|SUPABASE_SERVICE_ROLE" rnd --include='*.js' --include='*.html'

      - name: Verify tenant security schema
        run: |
          set -euo pipefail
          schema='supabase/migrations/20260830_release_a_foundation.sql'
          grep -q 'business_id uuid not null' "$schema"
          grep -q 'alter table public.businesses enable row level security' "$schema"
          grep -q 'alter table public.business_members enable row level security' "$schema"
          grep -q 'alter table public.business_settings enable row level security' "$schema"
          grep -q 'alter table public.dogs enable row level security' "$schema"
          grep -q 'alter table public.stays enable row level security' "$schema"
          grep -q 'public.is_business_member' "$schema"
          grep -q 'public.is_business_owner' "$schema"
          grep -q 'stays_dog_same_tenant' "$schema"
          grep -q 'stays_business_dates_idx' "$schema"
          grep -q 'No anonymous tenant access' "$schema"

      - name: Verify operational booking schema
        run: |
          set -euo pipefail
          schema='supabase/migrations/20260830_operational_booking_times.sql'
          test -f "$schema"
          grep -q 'arrival_time time' "$schema"
          grep -q 'departure_time time' "$schema"
          grep -q 'stays_business_status_idx' "$schema"
          ! grep -q 'stays_business_date_idx' "$schema"
          grep -q "from('stays')" rnd/operational-actions.js
          grep -q "from('dogs')" rnd/operational-actions.js
          grep -q 'business_id:api.businessId' rnd/operational-actions.js

      - name: Verify preview hosting contract
        run: |
          set -euo pipefail
          redirect='supabase/functions/release-a-rnd-preview/index.ts'
          test -f "$redirect"
          grep -q 'https://wafflepug.github.io/dog-calendar/rnd-preview/' "$redirect"
          grep -q 'status: 302' "$redirect"
          grep -q 'X-Robots-Tag' "$redirect"
          ! grep -E "Content-Type.*text/html|text/html.*Content-Type" "$redirect"
          ! grep -E "sb_secret_|SUPABASE_SERVICE_ROLE" "$redirect"
          grep -q 'https://wafflepug.github.io/dog-calendar/rnd-preview/' docs/release-a-rnd.md
          grep -q 'Supabase Edge Functions are not used to host HTML' docs/release-a-rnd.md

      - name: Verify production Apps Script remains main-only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/deploy-apps-script.yml').read_text()
          marker = "branches:\n      - main"
          if marker not in text:
              raise SystemExit('Production Apps Script workflow is no longer main-only')
          if 'release-a-rnd' in text:
              raise SystemExit('R&D branch must never appear in production Apps Script deployment workflow')
          print('Production Apps Script deployment remains isolated to main.')
          PY

      - name: R&D contract summary
        run: |
          echo 'Release A R&D is isolated from Waffle House production.'
          echo 'Operational Today, Calendar, Add, Care and Settings modules are syntax checked.'
          echo 'GitHub Pages hosts the static R&D wrapper; Supabase Edge Function is redirect-only.'
          echo 'No production Apps Script deployment step is defined in this workflow.'
