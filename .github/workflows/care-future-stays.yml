name: Care Future Stays

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-stays-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Future Stays JavaScript
        run: |
          node --check waffle-v11.1.95.js
          node --check waffle-v11.1.96.js
          node --check waffle-v11.1.97.js
          node --check waffle-v11.2.00.js
          node --check waffle-v11.1.98.js
          node --check waffle-v11.1.99.js
          node --check apps-script/V11198ConfirmedStayDelete.js
      - name: Validate Future Stays contract
        run: python3 scripts/check-care-future-stays.py
