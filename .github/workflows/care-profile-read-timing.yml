name: Care profile read timing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'directory.html'
      - '*.js'
      - '*.css'
      - 'tests/care-profile-read-timing.browser.spec.js'
      - 'tests/care-profile-performance.browser.spec.js'
      - 'tests/care-profile-performance.test.js'
      - 'tests/care-profile-shared-reads.test.js'
      - 'tests/care-profile-read-consumers.test.js'
      - 'playwright.care-profile-timing.config.js'
      - 'scripts/local-network-policy.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/care-profile-read-timing.yml'
  push:
    branches: [main]
    paths:
      - 'directory.html'
      - '*.js'
      - '*.css'
      - 'tests/care-profile-read-timing.browser.spec.js'
      - 'tests/care-profile-performance.browser.spec.js'
      - 'tests/care-profile-performance.test.js'
      - 'tests/care-profile-shared-reads.test.js'
      - 'tests/care-profile-read-consumers.test.js'
      - 'playwright.care-profile-timing.config.js'
      - 'scripts/local-network-policy.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/care-profile-read-timing.yml'

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-24.04 # Playwright 1.55.1 does not support Ubuntu 26.04.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Cache Playwright Chromium
        id: browser_cache
        uses: actions/cache@v4
        timeout-minutes: 3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned npm dependencies
        id: install_dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund
      - name: Install browser system dependencies and Chromium
        id: install_browsers
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          node node_modules/@playwright/test/cli.js install-deps chromium
          node node_modules/@playwright/test/cli.js install chromium
      - name: Report browser test setup failure
        if: failure() && (steps.browser_cache.outcome == 'failure' || steps.browser_cache.outcome == 'cancelled' || steps.install_dependencies.outcome == 'failure' || steps.install_dependencies.outcome == 'cancelled' || steps.install_browsers.outcome == 'failure' || steps.install_browsers.outcome == 'cancelled')
        run: |
          {
            echo '## Browser test setup failed before tests'
            echo
            echo 'Cache restoration, npm installation, or Chromium/system dependency setup failed or timed out. Care timing tests did not run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run bounded cold and warm checks
        timeout-minutes: 10
        run: node node_modules/@playwright/test/cli.js test --config=playwright.care-profile-timing.config.js
      - name: Upload JSON evidence and Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-profile-read-timing-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            evidence/care-profile-read-timing-report.json
            test-results/
            playwright-report/
