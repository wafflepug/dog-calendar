name: Sitter Navigation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitter-navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sitter navigation syntax and contract
        run: |
          set -euo pipefail
          node --check waffle-sitter-navigation.js
          node --check waffle-bootstrap.js
          python3 scripts/check-sitter-navigation.py
