name: Home Guest Portraits
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: node node_modules/@playwright/test/cli.js test --config=playwright.home.config.js
      - run: node node_modules/@playwright/test/cli.js test --config=playwright.first-open.config.js
