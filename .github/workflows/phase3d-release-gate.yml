name: Phase 3D Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Phase 3D release contract
        run: |
          set -euo pipefail
          node --check waffle-bootstrap.js
          node --check waffle-diagnostics.js
          node --check service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          build=json.loads(Path('waffle-build.json').read_text(encoding='utf-8'))
          release=json.loads(Path('waffle-release.json').read_text(encoding='utf-8'))
          assert build.get('releaseHardeningPhase') == 'phase-3d-release-regression-observability'
          assert release.get('release') == 'phase3d-2026.08.28.01'
          assert release.get('runtimeBuild') == build.get('build')
          assert release.get('productionWritesInSmokeTests') is False
          for path in ['waffle-diagnostics.js','system-status.html','tests/phase3d-smoke.spec.js','docs/phase-3d-release.md']:
              assert Path(path).exists(), f'Phase 3D asset missing: {path}'
          PY
          grep -q '"waffle-diagnostics.js"' waffle-bootstrap.js
          grep -q 'system-status.html' service-worker.js
          grep -q 'waffle-release.json' service-worker.js

      - name: Verify live maintenance matches committed release state
        env:
          APPS_SCRIPT_WEBAPP_URL: https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec
        run: |
          set -euo pipefail
          expected="$(python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('apps-script/MaintenanceMode.js').read_text(encoding='utf-8')
          m=re.search(r'WAFFLE_MAINTENANCE_DEFAULT_\s*=\s*(true|false)\s*;',text)
          if not m: raise SystemExit('maintenance default missing')
          print(m.group(1))
          PY
          )"
          for attempt in $(seq 1 18); do
            response="$(curl -fsSLG --max-time 20 "$APPS_SCRIPT_WEBAPP_URL" --data-urlencode 'action=maintenance_status' --data-urlencode "_=${GITHUB_RUN_ID}-${attempt}" || true)"
            if RESPONSE="$response" EXPECTED="$expected" python3 - <<'PY'
          import json,os,sys
          try: payload=json.loads(os.environ.get('RESPONSE',''))
          except Exception: sys.exit(1)
          expected=os.environ.get('EXPECTED')=='true'
          if payload.get('result')!='success' or payload.get('enabled') is not expected: sys.exit(1)
          print('Maintenance release gate verified · enabled='+str(payload.get('enabled')).lower())
          PY
            then exit 0; fi
            sleep 5
          done
          echo "Live maintenance state did not match committed release state."
          exit 1

      - name: Verify read-only backend health
        env:
          APPS_SCRIPT_WEBAPP_URL: https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec
        run: |
          set -euo pipefail
          health="$(curl -fsSLG --max-time 25 "$APPS_SCRIPT_WEBAPP_URL" --data-urlencode 'action=health')"
          ai="$(curl -fsSLG --max-time 25 "$APPS_SCRIPT_WEBAPP_URL" --data-urlencode 'payload={"action":"waffle_ai_health"}')"
          HEALTH="$health" AI="$ai" python3 - <<'PY'
          import json,os
          health=json.loads(os.environ['HEALTH'])
          ai=json.loads(os.environ['AI'])
          assert health.get('result')=='success' and health.get('action')=='health'
          assert ai.get('result')=='success' and ai.get('action')=='waffle_ai_health'
          assert ai.get('routeReady') is True and ai.get('readOnly') is True
          print('Backend + Ask Waffle read-only health verified.')
          PY

      - name: Verify maintenance write lock without writing data
        env:
          APPS_SCRIPT_WEBAPP_URL: https://script.google.com/macros/s/AKfycbwn4HL49K9c3AZbXJRUjPw3UYWxJt8DmqXwMnTytyqdSstj3ZIJwWdDEC2IsBjetOf3pw/exec
        run: |
          set -euo pipefail
          if ! grep -q 'WAFFLE_MAINTENANCE_DEFAULT_ = true' apps-script/MaintenanceMode.js; then
            echo "Maintenance is off; destructive-path probe intentionally skipped."
            exit 0
          fi
          response="$(curl -fsSLG --max-time 20 "$APPS_SCRIPT_WEBAPP_URL" --data-urlencode 'payload={"action":"phase3d_write_probe_never_execute"}')"
          RESPONSE="$response" python3 - <<'PY'
          import json,os
          payload=json.loads(os.environ['RESPONSE'])
          assert payload.get('result')=='error'
          assert 'maintenance mode' in str(payload.get('error','')).lower()
          print('Maintenance write lock rejected the non-existent write probe before routing.')
          PY
