<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waffle House Recovery</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(92vw,520px);background:#fff;border:1px solid #d9e2ec;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(15,23,42,.10);text-align:center}
    .spinner{width:34px;height:34px;margin:0 auto 18px;border:4px solid #d9e2ec;border-top-color:#0f6292;border-radius:50%;animation:spin .8s linear infinite}
    h1{font-size:22px;margin:0 0 10px}p{line-height:1.5;margin:8px 0;color:#475569}#status{font-weight:700;color:#0f6292}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Recovering Waffle House</h1>
    <p id="status">Clearing the stale app cache…</p>
    <p>This does not delete bookings, reminders, photos or Google Apps Script data.</p>
  </main>
  <script>
    (async function recover(){
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          status.textContent='Resetting the app service worker…';
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
        if('caches' in window){
          status.textContent='Clearing the stale Waffle House cache…';
          const keys=await caches.keys();
          await Promise.all(keys.filter(key=>key.startsWith('waffle-house-')).map(key=>caches.delete(key)));
        }
        status.textContent='Recovery complete. Reopening the app…';
        setTimeout(()=>location.replace('./index.html?recovery=11.1.4&t='+Date.now()),450);
      }catch(error){
        console.error(error);
        status.textContent='Recovery could not complete automatically. Close this tab and reopen it, then try again.';
      }
    })();
  </script>
</body>
</html>
